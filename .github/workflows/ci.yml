name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra osm
      - name: Secrets scan
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline --exclude-files "^uv\.lock$"
      - name: File size and data format guard
        run: git ls-files -z | xargs -0 uv run python scripts/check_file_size.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: DATA_SOURCES.md matches the dataset declarations
        run: uv run python -m irerero.data --check
      - name: Data dictionary matches the models
        run: uv run python -m irerero.docs --check
      - name: Build from the demo bundle
        run: uv run python -m irerero.pipeline.build
      - run: uv run pytest
