name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: irerero
          POSTGRES_PASSWORD: irerero  # pragma: allowlist secret
          POSTGRES_DB: irerero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U irerero" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://irerero:irerero@localhost:5432/irerero  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Secrets scan
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
      - name: File size and data format guard
        run: git ls-files -z | xargs -0 uv run python scripts/check_file_size.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrate
        working-directory: apps/api
        run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d --wait
      - name: Smoke test
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/health
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/
      - name: Logs on failure
        if: failure()
        run: docker compose logs
