[project]
name = "irerero-api"
version = "0.1.0"
description = "IrereroAI HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "irerero-contract",
  "irerero-engine",
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "pydantic-settings>=2.15",
  "pyjwt>=2.15",
  "pyotp>=2.10",
]

[tool.uv.sources]
irerero-contract = { workspace = true }
irerero-engine = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irerero_api"]
