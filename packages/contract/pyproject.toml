[project]
name = "irerero-contract"
version = "0.1.0"
description = "IrereroAI data contract: database tables, record models, code lists and JSON Schemas"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.14",
  "sqlalchemy>=2.1",
  "geoalchemy2>=0.20",
  "argon2-cffi>=25.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irerero_contract"]
