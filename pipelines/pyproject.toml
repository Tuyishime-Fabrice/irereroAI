[project]
name = "irerero-pipelines"
version = "0.1.0"
description = "Dataset loaders, the demo data that stands in for missing files, and the build"
requires-python = ">=3.12,<3.13"
dependencies = [
  "irerero-contract",
  "irerero-engine",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "irerero-api",
]

[project.optional-dependencies]
# Only needed to load rasters (WorldPop, CHIRPS, SRTM, VIIRS) and the OpenStreetMap extract.
geo = ["rasterio>=1.4", "osmium>=4.0"]

[tool.uv.sources]
irerero-contract = { workspace = true }
irerero-engine = { workspace = true }
irerero-api = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The package is the `pipelines/` directory itself so that the build lives at
# pipelines/build.py and runs as `python -m pipelines.build`.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build]
dev-mode-dirs = [".."]
