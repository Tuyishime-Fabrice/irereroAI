[project]
name = "irereroai"
version = "1.0.0"
description = "AI planning and action platform for early childhood development in Rwanda"
requires-python = ">=3.11,<3.12"
dependencies = [
  "streamlit>=1.50",
  "pydeck>=0.9",
  "altair>=5.5",
  "pandas>=2.3",
  "numpy>=2.2",
  "pyarrow>=21",
  "geopandas>=1.1",
  "shapely>=2.1",
  "pyogrio>=0.11",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "rasterstats>=0.20",
  "scikit-learn>=1.7",
  "lightgbm>=4.6",
  "shap>=0.48",
  "pdfplumber>=0.11",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "fpdf2>=2.8",
  "anthropic>=1.0",
  # Walking distance along roads from the OpenStreetMap extract in the data bundle. Required:
  # Streamlit Community Cloud installs from uv.lock without extras.
  "osmium>=4.0",
  "networkx>=3.4",
]

[project.optional-dependencies]
# Kept so `uv sync --extra osm` (make install, CI) still works; now part of the dependencies.
osm = ["osmium>=4.0", "networkx>=3.4"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13", "detect-secrets>=1.5", "pre-commit>=4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PTH"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# CSS and SVG icon paths are long by nature
"irerero/ui/theme.py" = ["E501"]
"irerero/ui/maps.py" = ["E501"]
"app/views/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
